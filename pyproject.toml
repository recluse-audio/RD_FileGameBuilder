[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-game-builder"
version = "0.1.0"
description = "GUI tool for visualizing and editing RD File Game Engine project data"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0.0",
    "tkinterdnd2>=0.3.0",
]
